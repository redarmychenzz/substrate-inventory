<!DOCTYPE html>
<html lang="zh-TW" data-style="industrial" data-theme="dark">
<head>
  <meta name="version" content="1783483355">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基板庫存管理系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    /* ── 共用不變變數 ── */
    :root {
      --blue:   #4a8fff;
      --teal:   #2dc9a0;
      --amber:  #f5a623;
      --red:    #f05555;
      --green:  #3dcb82;
      font-size: 15px;
    }

    /* ══════════════════════════════════
       🏭 INDUSTRIAL — DARK
    ══════════════════════════════════ */
    [data-style="industrial"][data-theme="dark"] {
      --bg:        #080c10;
      --panel:     #0f1318;
      --panel2:    #141c24;
      --border:    #1e2530;
      --border2:   #161e28;
      --text:      #94a8b8;
      --text2:     #4a5e6e;
      --text3:     #2c3a48;
      --heading:   #e8f0fe;
      --accent:    #00d4aa;
      --accent2:   #00a882;
      --blue-dim:  rgba(0,212,170,.12);
      --teal-dim:  rgba(0,212,170,.08);
      --amber-dim: rgba(245,166,35,.15);
      --red-dim:   rgba(240,85,85,.15);
      --green-dim: rgba(0,212,170,.15);
      --gray-dim:  rgba(74,94,110,.15);
      --hover:     rgba(0,212,170,.04);
      --expand-bg: rgba(4,8,14,.65);
      --shadow:    0 2px 16px rgba(0,0,0,.7);
      --radius:    2px;
      --radius-sm: 1px;
      --font-num:  'Space Mono', 'Courier New', monospace;
    }

    /* ══════════════════════════════════
       🏭 INDUSTRIAL — LIGHT
    ══════════════════════════════════ */
    [data-style="industrial"][data-theme="light"] {
      --bg:        #f0f2f5;
      --panel:     #ffffff;
      --panel2:    #f5f7fa;
      --border:    #d0d5dd;
      --border2:   #e0e5ee;
      --text:      #2d3748;
      --text2:     #5a6a7a;
      --text3:     #9aa5b4;
      --heading:   #1a2332;
      --accent:    #0a6e5c;
      --accent2:   #0d8a72;
      --blue-dim:  rgba(10,110,92,.1);
      --teal-dim:  rgba(10,110,92,.08);
      --amber-dim: rgba(245,166,35,.12);
      --red-dim:   rgba(240,85,85,.1);
      --green-dim: rgba(10,110,92,.12);
      --gray-dim:  rgba(90,100,115,.1);
      --hover:     rgba(10,110,92,.04);
      --expand-bg: rgba(245,247,250,.8);
      --shadow:    0 2px 12px rgba(0,0,0,.08);
      --radius:    2px;
      --radius-sm: 1px;
      --font-num:  'Space Mono', 'Courier New', monospace;
    }

    /* ══════════════════════════════════
       🔮 GLASS — DARK
    ══════════════════════════════════ */
    [data-style="glass"][data-theme="dark"] {
      --bg:        #0e0820;
      --panel:     rgba(255,255,255,.07);
      --panel2:    rgba(255,255,255,.04);
      --border:    rgba(167,139,250,.2);
      --border2:   rgba(167,139,250,.1);
      --text:      #ddd8f8;
      --text2:     #9890c0;
      --text3:     #5a5580;
      --heading:   #f0ecff;
      --accent:    #a78bfa;
      --accent2:   #60a5fa;
      --blue-dim:  rgba(167,139,250,.15);
      --teal-dim:  rgba(96,165,250,.12);
      --amber-dim: rgba(245,166,35,.15);
      --red-dim:   rgba(240,85,85,.15);
      --green-dim: rgba(61,203,130,.12);
      --gray-dim:  rgba(152,144,192,.12);
      --hover:     rgba(167,139,250,.06);
      --expand-bg: rgba(14,8,32,.5);
      --shadow:    0 4px 24px rgba(0,0,0,.5), 0 0 0 1px rgba(167,139,250,.15);
      --radius:    12px;
      --radius-sm: 8px;
      --font-num:  inherit;
      --glass-blur: blur(16px);
      --bg-gradient: linear-gradient(135deg, #0e0820 0%, #12082e 50%, #0a1020 100%);
    }

    /* ══════════════════════════════════
       🔮 GLASS — LIGHT
    ══════════════════════════════════ */
    [data-style="glass"][data-theme="light"] {
      --bg:        #f0edff;
      --panel:     rgba(255,255,255,.65);
      --panel2:    rgba(255,255,255,.45);
      --border:    rgba(139,92,246,.2);
      --border2:   rgba(139,92,246,.1);
      --text:      #2d2550;
      --text2:     #7060a0;
      --text3:     #b0a0d0;
      --heading:   #1a1038;
      --accent:    #7c3aed;
      --accent2:   #3b82f6;
      --blue-dim:  rgba(124,58,237,.1);
      --teal-dim:  rgba(59,130,246,.1);
      --amber-dim: rgba(245,166,35,.12);
      --red-dim:   rgba(240,85,85,.1);
      --green-dim: rgba(61,203,130,.1);
      --gray-dim:  rgba(112,96,160,.1);
      --hover:     rgba(124,58,237,.05);
      --expand-bg: rgba(240,237,255,.7);
      --shadow:    0 4px 24px rgba(124,58,237,.12), 0 0 0 1px rgba(139,92,246,.15);
      --radius:    12px;
      --radius-sm: 8px;
      --font-num:  inherit;
      --glass-blur: blur(12px);
      --bg-gradient: linear-gradient(135deg, #f0edff 0%, #e8e0ff 50%, #edf5ff 100%);
    }

    /* ══════════════════════════════════
       🍬 CUTE — DARK
    ══════════════════════════════════ */
    [data-style="cute"][data-theme="dark"] {
      --bg:        #1a1040;
      --panel:     #251848;
      --panel2:    #2e2058;
      --border:    #4a3880;
      --border2:   #362a68;
      --text:      #f0d8ff;
      --text2:     #c0a0e0;
      --text3:     #806090;
      --heading:   #ffd6f0;
      --accent:    #ff6b9d;
      --accent2:   #ffd93d;
      --blue-dim:  rgba(255,107,157,.15);
      --teal-dim:  rgba(255,217,61,.12);
      --amber-dim: rgba(255,217,61,.2);
      --red-dim:   rgba(255,107,157,.2);
      --green-dim: rgba(100,220,150,.15);
      --gray-dim:  rgba(192,160,224,.12);
      --hover:     rgba(255,107,157,.06);
      --expand-bg: rgba(20,10,50,.5);
      --shadow:    0 4px 20px rgba(255,107,157,.15);
      --radius:    20px;
      --radius-sm: 14px;
      --font-num:  inherit;
    }

    /* ══════════════════════════════════
       🍬 CUTE — LIGHT
    ══════════════════════════════════ */
    [data-style="cute"][data-theme="light"] {
      --bg:        #fff8f0;
      --panel:     #ffffff;
      --panel2:    #fff0f8;
      --border:    #ffd6e8;
      --border2:   #ffe8f4;
      --text:      #4a2840;
      --text2:     #9a6880;
      --text3:     #c8a0b8;
      --heading:   #2a1030;
      --accent:    #ff6b9d;
      --accent2:   #ff9500;
      --blue-dim:  rgba(255,107,157,.1);
      --teal-dim:  rgba(255,149,0,.1);
      --amber-dim: rgba(255,217,61,.2);
      --red-dim:   rgba(255,107,157,.15);
      --green-dim: rgba(100,220,150,.12);
      --gray-dim:  rgba(154,104,128,.1);
      --hover:     rgba(255,107,157,.05);
      --expand-bg: rgba(255,248,240,.7);
      --shadow:    0 4px 20px rgba(255,107,157,.1);
      --radius:    20px;
      --radius-sm: 14px;
      --font-num:  inherit;
    }

    /* ══════════════════════════════════
       💙 CYBER — DARK（原始藍色風格）
    ══════════════════════════════════ */
    [data-style="cyber"][data-theme="dark"] {
      --bg:        #0d0f14;
      --panel:     #141720;
      --panel2:    #1c2030;
      --border:    #2a2f3e;
      --border2:   #1e2330;
      --text:      #c8cdd8;
      --text2:     #7a8299;
      --text3:     #4a5166;
      --heading:   #e8ecf4;
      --accent:    #4a8fff;
      --accent2:   #2dc9a0;
      --blue-dim:  rgba(74,143,255,.15);
      --teal-dim:  rgba(45,201,160,.15);
      --amber-dim: rgba(245,166,35,.15);
      --red-dim:   rgba(240,85,85,.15);
      --green-dim: rgba(61,203,130,.15);
      --gray-dim:  rgba(122,130,153,.15);
      --hover:     rgba(255,255,255,.035);
      --expand-bg: rgba(10,12,20,.5);
      --shadow:    0 2px 12px rgba(0,0,0,.4);
      --radius:    6px;
      --radius-sm: 4px;
      --font-num:  inherit;
    }

    /* ══════════════════════════════════
       💙 CYBER — LIGHT（原始淺色風格）
    ══════════════════════════════════ */
    [data-style="cyber"][data-theme="light"] {
      --bg:        #f0f2f7;
      --panel:     #ffffff;
      --panel2:    #f6f8fc;
      --border:    #dde1ea;
      --border2:   #e8eaf0;
      --text:      #3a3f52;
      --text2:     #6b7288;
      --text3:     #9ba0b0;
      --heading:   #1a1d28;
      --accent:    #4a8fff;
      --accent2:   #2dc9a0;
      --blue-dim:  rgba(74,143,255,.1);
      --teal-dim:  rgba(45,201,160,.1);
      --amber-dim: rgba(245,166,35,.1);
      --red-dim:   rgba(240,85,85,.1);
      --green-dim: rgba(61,203,130,.1);
      --gray-dim:  rgba(122,130,153,.1);
      --hover:     rgba(0,0,0,.03);
      --expand-bg: rgba(240,242,247,.6);
      --shadow:    0 2px 12px rgba(0,0,0,.1);
      --radius:    6px;
      --radius-sm: 4px;
      --font-num:  inherit;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', 'Space Mono', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background .2s, color .2s;
    }
    a { color: var(--blue); text-decoration: none; }

    /* ─── HEADER ─── */
    .header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }
    .header-logo {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--accent, var(--blue));
      text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid var(--accent, var(--blue));
      border-radius: var(--radius-sm);
      opacity: .9;
      white-space: nowrap;
    }
    .header-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--heading);
      letter-spacing: .03em;
      flex: 1;
    }
    .header-title span { color: var(--text2); font-weight: 300; margin-left: 6px; font-size: 12px; }

    /* ─── TABS ─── */
    .tabs {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      gap: 2px;
    }
    .tab-btn {
      cursor: pointer;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text2);
      padding: 12px 18px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      letter-spacing: .02em;
      transition: all .15s;
      white-space: nowrap;
      display: flex; align-items: center; gap: 7px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
    .tab-icon { font-size: 14px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ─── MAIN LAYOUT ─── */
    .main { padding: 24px; max-width: 1400px; margin: 0 auto; }
    @media (max-width: 768px) { .main { padding: 16px; } }

    /* ─── STATS CARDS ─── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--accent, var(--blue));
    }
    .stat-card.blue { --accent: var(--blue); }
    .stat-card.teal { --accent: var(--teal); }
    .stat-card.amber { --accent: var(--amber); }
    .stat-card.red { --accent: var(--red); }
    .stat-card.green { --accent: var(--green); }
    .stat-label {
      font-size: 11px;
      color: var(--text2);
      letter-spacing: .06em;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace;
      margin-bottom: 8px;
    }
    .stat-value {
      font-family: 'Space Mono', monospace;
      font-size: 2.4rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--heading);
      line-height: 1;
    }
    .stat-unit {
      font-size: 13px;
      font-weight: 400;
      color: var(--text2);
      margin-left: 4px;
    }
    .stat-sub {
      font-size: 11px;
      color: var(--text3);
      font-family: 'Space Mono', monospace;
      margin-top: 6px;
    }

    /* ─── TABLE ─── */
    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .table-header-bar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .table-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      letter-spacing: .07em;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace;
      flex: 1;
    }
    .table-hint {
      font-size: 11px;
      color: var(--text3);
      font-family: 'Space Mono', monospace;
    }
    .search-bar {
      display: flex; align-items: center;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 10px;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }
    .search-bar svg { flex-shrink: 0; opacity: .5; }
    .search-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      padding: 7px 0;
      width: 100%;
    }
    .search-bar input::placeholder { color: var(--text3); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    thead th {
      background: var(--panel2);
      padding: 9px 14px;
      text-align: left;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text3);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    thead th.num { text-align: right; }
    tbody tr.group-row {
      cursor: pointer;
      transition: background .1s;
      border-bottom: 1px solid var(--border2);
    }
    tbody tr.group-row:hover { background: var(--hover); }
    tbody tr.group-row td {
      padding: 10px 14px;
      vertical-align: middle;
      font-family: 'Space Mono', monospace;
    }
    tbody tr.group-row td.num { text-align: right; }
    .expand-icon {
      display: inline-flex;
      width: 18px; height: 18px;
      align-items: center; justify-content: center;
      border: 1px solid var(--border);
      border-radius: 3px;
      margin-right: 8px;
      font-size: 10px;
      color: var(--text3);
      transition: transform .2s;
      flex-shrink: 0;
    }
    .expand-icon.open { transform: rotate(90deg); border-color: var(--blue); color: var(--blue); }
    .size-name {
      display: flex;
      align-items: center;
      color: var(--text);
      font-size: 12px;
    }
    .size-count {
      font-size: 11px;
      color: var(--text3);
      margin-left: 8px;
    }
    /* expand detail rows */
    .detail-section {
      overflow: hidden;
      max-height: 0;
      transition: max-height 200ms ease;
    }
    /* .detail-section.open max-height is set dynamically by JS (scrollHeight) */
    .detail-table-wrap {
      background: var(--expand-bg);
      border-bottom: 1px solid var(--border);
    }
    .detail-table-wrap table tbody tr:hover { background: var(--hover); transition: background 150ms; }
    .detail-table-wrap table thead th {
      background: transparent;
      font-size: 12px;
      padding: 7px 14px 7px 36px;
      color: #5a6580;
    }
    .detail-table-wrap table thead th:first-child { padding-left: 52px; }
    .detail-table-wrap table tbody tr {
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .detail-table-wrap table tbody tr:last-child { border-bottom: none; }
    .detail-table-wrap table tbody td {
      padding: 10px 14px 10px 36px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-style: normal;
      font-weight: 400;
      color: var(--text);
      vertical-align: middle;
    }
    .detail-table-wrap .lot-id {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--heading);
    }
    .detail-table-wrap table tbody td:first-child { padding-left: 52px; }

    /* plain tbody rows (for 6012 table) */
    tbody tr.data-row {
      border-bottom: 1px solid var(--border2);
      transition: background .1s;
    }
    tbody tr.data-row:hover { background: var(--hover); }
    tbody tr.data-row td {
      padding: 9px 14px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      vertical-align: top;
      color: var(--text);
    }
    tbody tr.data-row:last-child { border-bottom: none; }

    /* ─── BADGES ─── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px;
      border-radius: var(--radius);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .badge.blue { background: var(--blue-dim); color: var(--blue); }
    .badge.amber { background: var(--amber-dim); color: var(--amber); }
    .badge.red { background: var(--red-dim); color: var(--red); }
    .badge.green { background: var(--green-dim); color: var(--green); }
    .badge.teal { background: var(--teal-dim); color: var(--teal); }
    .badge.gray { background: var(--gray-dim); color: var(--text2); }

    /* ─── NUM CELLS ─── */
    .num-cell {
      text-align: right;
      font-family: 'Space Mono', monospace;
      font-variant-numeric: tabular-nums;
      color: var(--heading);
      font-weight: 500;
    }
    .num-cell.a { color: var(--blue); }
    .num-cell.b { color: var(--amber); }
    .num-cell.total { color: var(--teal); font-weight: 600; }

    /* ─── LOADING / ERROR ─── */
    .state-box {
      padding: 48px 24px;
      text-align: center;
      color: var(--text3);
    }
    .state-box .icon { font-size: 32px; margin-bottom: 12px; }
    .state-box .msg { font-size: 13px; color: var(--text2); margin-bottom: 8px; }
    .state-box .detail {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text3);
      max-width: 520px;
      margin: 8px auto 0;
      text-align: left;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      line-height: 1.8;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── SETTINGS PAGE ─── */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 768px) { .settings-grid { grid-template-columns: 1fr; } }
    .settings-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
    }
    .settings-card h3 {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text3);
      font-family: 'Space Mono', monospace;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .field-group { margin-bottom: 14px; }
    .field-group:last-child { margin-bottom: 0; }
    .field-label {
      display: block;
      font-size: 11px;
      color: var(--text2);
      font-family: 'Space Mono', monospace;
      margin-bottom: 5px;
      letter-spacing: .04em;

<script>
'use strict';

const PWD_HASH = '80bcbc8116c90758e6efd4740c94caab840d53dc3fe1ebe4003be10b67127eef';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPwd() {
  const val = document.getElementById('lockInput').value;
  const h   = await sha256(val);
  if (h === PWD_HASH) {
    localStorage.setItem('hy_auth', h);
    document.getElementById('lockScreen').style.display = 'none';
  } else {
    const err = document.getElementById('lockErr');
    err.textContent = '密碼錯誤，請重試';
    document.getElementById('lockInput').value = '';
    document.getElementById('lockInput').focus();
    setTimeout(() => { err.textContent = ''; }, 3000);
  }
}

async function initAuth() {
  const saved = localStorage.getItem('hy_auth');
  if (saved && saved === PWD_HASH) {
    document.getElementById('lockScreen').style.display = 'none';
  } else {
    document.getElementById('lockScreen').style.display = 'flex';
    setTimeout(() => document.getElementById('lockInput').focus(), 100);
  }
}

// buildURL — for display / settings preview only (CSV format)
function buildURL(sheetId, gidOrName) {
  const base = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;
  return /^\d+$/.test(gidOrName)
    ? `${base}&gid=${gidOrName}`
    : `${base}&sheet=${encodeURIComponent(gidOrName)}`;
}

// ════════════════════════════════════════════
//  GVIZ JSON → 2-D ROWS ARRAY
// ════════════════════════════════════════════
function gvizToRows(response) {
  const table = response.table;
  if (!table) return [];
  const headers = table.cols.map(c => (c.label || '').trim());
  const rows = [headers];
  for (const row of (table.rows || [])) {
    if (!row || !row.c) { rows.push(headers.map(() => '')); continue; }
    const cells = row.c.map((cell, i) => {
      if (!cell || cell.v === null || cell.v === undefined) return '';
      const colType = (table.cols[i] || {}).type || '';
      // Use formatted string for date/datetime
      if (colType === 'datetime' || colType === 'date' || colType === 'timeofday') {
        return cell.f || '';
      }
      return String(cell.v);
    });
    rows.push(cells);
  }
  // Remove trailing all-empty rows
  while (rows.length > 1 && rows[rows.length - 1].every(c => !c)) rows.pop();
  return rows;
}

// ════════════════════════════════════════════
//  COLUMN DETECTION
// ════════════════════════════════════════════
function findCol(headers, keywords) {
  const lh = headers.map(h => (h || '').toLowerCase().trim());
  // 1. Exact match
  for (const kw of keywords) {
    const k = kw.toLowerCase();
    const i = lh.findIndex(h => h === k);
    if (i !== -1) return i;
  }
  // 2. Substring match (first keyword wins)
  for (const kw of keywords) {
    const k = kw.toLowerCase();
    const i = lh.findIndex(h => h.includes(k));
    if (i !== -1) return i;
  }
  return -1;
}

// ════════════════════════════════════════════
//  FETCH via JSONP  (works with file:// + http://)
// ════════════════════════════════════════════
function fetchGVizJSON(sheetId, gidOrName) {
  return new Promise((resolve, reject) => {
    const cbName = 'hy_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    const base = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq`;
    const gidParam = /^\d+$/.test(gidOrName)
      ? `gid=${gidOrName}`
      : `sheet=${encodeURIComponent(gidOrName)}`;
    const url = `${base}?${gidParam}&tqx=out:json;responseHandler:${cbName}`;

    const script = document.createElement('script');
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('請求逾時（15s），請確認網路連線'));
    }, 15000);

    function cleanup() {
      clearTimeout(timer);
      try { delete window[cbName]; } catch (_) {}
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(response) {
      cleanup();
      if (!response || !response.table) {
        reject(new Error('SHEET_NOT_PUBLIC'));
        return;
      }
      if (response.status === 'error') {
        const msg = (response.errors || []).map(e => e.message).join('; ') || 'SHEET_ERROR';
        reject(new Error(msg));
        return;
      }
      resolve(gvizToRows(response));
    };

    script.onerror = () => {
      cleanup();
      reject(new Error('SCRIPT_LOAD_ERROR'));
    };

    script.src = url;
    document.head.appendChild(script);
  });
}

function errBox(containerId, url, errMsg) {
  const isAccess = errMsg === 'SHEET_NOT_PUBLIC' || errMsg === 'SCRIPT_LOAD_ERROR';
  let icon = '⚠️', title = '資料載入失敗', detail;
  if (isAccess) {
    icon = '🔒';
    title = '無法存取試算表';
    detail = `可能原因：\n• Google Sheets 尚未設定公開分享（「知道連結的人可以檢視」）\n• GID 或分頁名稱設定錯誤\n\n解決步驟：\n1. 開啟 Google Sheets → 右上角「共用」\n2. 將連結存取權改為「知道連結的人」→「檢視者」\n3. 確認 GID / 分頁名稱設定正確\n\n請求 URL：${url}`;
  } else if (errMsg.includes('逾時')) {
    icon = '⏱️';
    title = '連線逾時';
    detail = `${errMsg}\n請求 URL：${url}`;
  } else {
    detail = `錯誤訊息：${errMsg}\n請求 URL：${url}`;
  }
  document.getElementById(containerId).innerHTML = `
    <div class="table-wrap">
      <div class="state-box">
        <div class="icon">${icon}</div>
        <div class="msg">${title}</div>
        <div class="detail">${detail.replace(/\n/g, '<br>')}</div>
      </div>
    </div>`;
}

// ════════════════════════════════════════════
//  PARSE SIZE
// ════════════════════════════════════════════
function parseSize(spec) {
  const m = spec.match(/(\d+[Xx]\d+[Xx]\d+)/);
  if (!m) return null;
  return m[1].toUpperCase();
}

function renderBlanks(rows, url) {
  if (rows.length < 2) {
    document.getElementById('blanks-content').innerHTML =
      `<div class="table-wrap"><div class="state-box"><div class="icon">📭</div><div class="msg">資料表為空</div></div></div>`;
    return;
  }
  const headers = rows[0];
  const data = rows.slice(1).filter(r => r.some(c => c.trim()));

  // Column detection
  const colSize    = findCol(headers, ['規格', 'size', '尺寸']);
  const colLot     = findCol(headers, ['metal lot', '批號', 'lot']);
  const colWH      = findCol(headers, ['庫別', '倉庫', 'warehouse']);
  const colCarrier = findCol(headers, ['載具', 'carrier']);
  const colPurpose = findCol(headers, ['使用目的', '目的', 'purpose', '用途']);
  const colNote    = findCol(headers, ['備註', 'note']);
  const colThk     = findCol(headers, ['板厚', 'thickness', 'thk']);
  const colExp     = findCol(headers, ['費用化', 'exp']);

  // Filter valid rows (must have warehouse info)
  const valid = data.filter(r => {
    const wh = (r[colWH] || '').trim();
    return wh === 'A倉' || wh === 'B倉';
  });

  // Group by 規格
  const sizeMap = new Map();
  for (const r of valid) {
    const raw = (r[colSize] || '').trim();
    const sizeKey = parseSize(raw);
    if (sizeKey === null) continue;
    if (!sizeMap.has(sizeKey)) sizeMap.set(sizeKey, []);
    sizeMap.get(sizeKey).push(r);
  }

  // Stats
  const totalA = valid.filter(r => r[colWH].trim() === 'A倉').length;
  const totalB = valid.filter(r => r[colWH].trim() === 'B倉').length;
  const total  = totalA + totalB;

  // Stats header parse (optional, as supplementary info)

  const mB = hStat.match(/B倉[：:]\s*(\d+)\s*片/);

    </div>
    <div class="stat-card amber">
      <div class="stat-label">B 倉數量</div>

    </div>
    <div class="stat-card">
      <div class="stat-label">尺寸種類</div>
      <div class="stat-value">${sizeCount}<span class="stat-unit">種</span></div>
    </div>
  </div>
  ${headerNote}
  <div class="table-wrap">
    <div class="table-header-bar">
      <div class="table-title">基板尺寸庫存彙整</div>
      <div class="table-hint">點擊行展開批號明細</div>
      <button onclick="loadBlanks()" style="background:none;border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--text3);cursor:pointer;">↻ 重新整理</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>規格 / Size</th>
          <th class="num">A 倉</th>
          <th class="num">B 倉</th>
          <th class="num">合計</th>
        </tr>
      </thead>
      <tbody id="blanks-tbody">`;

  let idx = 0;
  for (const [sizeKey, items] of [...sizeMap.entries()].sort((a, b) => {
    const [a1, a2, a3] = a[0].split('X').map(Number);
    const [b1, b2, b3] = b[0].split('X').map(Number);
    return (a1 - b1) || (a2 - b2) || (a3 - b3);
  })) {

          </div>
        </td>
        <td class="num num-cell a">${cntA > 0 ? cntA : '<span style="color:var(--text3)">—</span>'}</td>
        <td class="num num-cell b">${cntB > 0 ? cntB : '<span style="color:var(--text3)">—</span>'}</td>
        <td class="num num-cell total">${cntT}</td>

    for (const r of items) {
      const wh = (r[colWH] || '').trim();
      const lot = (colLot >= 0 ? r[colLot] : '') || '—';
      const spec = (colSize >= 0 ? r[colSize] : '') || '';
      const carrier = (colCarrier >= 0 ? r[colCarrier] : '') || '—';

function toggleExpand(id) {
  const el = document.getElementById(id);
  const icon = document.getElementById('icon-' + id);
  if (!el || !icon) return;
  const open = el.classList.toggle('open');
  icon.textContent = open ? '▼' : '▶';
  icon.classList.toggle('open', open);
  el.style.maxHeight = open ? el.scrollHeight + 'px' : '0';
}

    html += `
      <tr class="data-row">
        <td style="white-space:nowrap;">${emp || '<span style="color:var(--text3)">—</span>'}</td>
        <td class="time-cell" style="white-space:nowrap;">${time || '—'}</td>
        <td style="white-space:nowrap;">${method}</td>
        <td>${machine || '—'}</td>
        <td class="hide-mobile">${pattern || '<span style="color:var(--text3)">—</span>'}</td>
        <td class="hide-mobile">${pm || '<span style="color:var(--text3)">—</span>'}</td>
        <td class="hide-mobile note-cell">${note}</td>
        <td class="hide-mobile" style="color:var(--text3);font-size:11px;">${adj}</td>
      </tr>`;
  }
  return html;
}

function render6012Static(rows) {
  const sorted = [...rows].sort((a, b) => {
    return parseChineseDateTime(b.time) - parseChineseDateTime(a.time);
  });
  let html = '';
  for (const r of sorted) {
    const mth = r.mth || '';
    const cls = /描畫|write|寫|曝光/i.test(mth) ? 'blue'
              : /報廢|scrap/i.test(mth)          ? 'red'
              : /退料|return/i.test(mth)          ? 'green'
              : /購入|buy|purchase/i.test(mth)    ? 'teal' : 'gray';
    html += `
      <tr class="data-row">
        <td style="white-space:nowrap;">${escHtml(r.emp||'') || '<span style="color:var(--text3)">—</span>'}</td>
        <td class="time-cell" style="white-space:nowrap;">${escHtml(r.time||'') || '—'}</td>
        <td style="white-space:nowrap;"><span class="badge ${cls}">${escHtml(mth) || '—'}</span></td>
        <td>${escHtml(r.mch||'') || '—'}</td>
        <td class="hide-mobile">${escHtml(r.pat||'') || '<span style="color:var(--text3)">—</span>'}</td>
        <td class="hide-mobile">${escHtml(r.pm||'') || '<span style="color:var(--text3)">—</span>'}</td>
        <td class="hide-mobile note-cell">${escHtml(r.note||'')}</td>
        <td class="hide-mobile" style="color:var(--text3);font-size:11px;"></td>
      </tr>`;
  }
  const tbody = document.getElementById('tbody-6012');
  if (tbody) tbody.innerHTML = html || `<tr class="empty-row"><td colspan="8">— 無符合資料 —</td></tr>`;
}

function filter6012(q) {
  if (STATIC_DATA !== null) {
    const kw = document.getElementById('search6012').value.toLowerCase();
    const rows = STATIC_DATA.s6012.rows;
    const filtered = kw
      ? rows.filter(r => Object.values(r).join(' ').toLowerCase().includes(kw))
      : rows;
    render6012Static(filtered);
    return;
  }
  const query = q.trim().toLowerCase();
  const cols = window._6012Cols;
  if (!cols) return;
  let filtered = !query ? [..._6012Rows] : _6012Rows.filter(r =>
    r.some(c => c.toLowerCase().includes(query))
  );
  filtered.sort((a, b) => {
    const ta = parseChineseDateTime(cols.colTime >= 0 ? a[cols.colTime] : '');
    const tb = parseChineseDateTime(cols.colTime >= 0 ? b[cols.colTime] : '');
    return tb - ta;
  });
  const { colEmployee, colTime, colMethod, colMachine, colPattern, colPM, colNote, colAdj, methodBadge } = cols;
  document.getElementById('tbody-6012').innerHTML =
    render6012Rows(filtered, colEmployee, colTime, colMethod, colMachine, colPattern, colPM, colNote, colAdj, methodBadge);
}

function parseChineseDateTime(str) {
  if (!str) return 0;
  const m = str.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})\s*(上午|下午)?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (!m) return 0;
  let [, yr, mo, dy, ampm, hr, min, sec] = m;
  hr  = parseInt(hr,  10);
  min = parseInt(min, 10);
  sec = parseInt(sec || '0', 10);
  if (ampm === '下午' && hr !== 12) hr += 12;
  if (ampm === '上午' && hr === 12) hr = 0;
  return new Date(parseInt(yr), parseInt(mo)-1, parseInt(dy), hr, min, sec).getTime();
}

function formatTime(t) {
  // gviz CSV datetime format: "2026/3/23 下午 3:52:06" or ISO
  return t;
}



// ════════════════════════════════════════════
//  STYLE & THEME
// ════════════════════════════════════════════
function applyStyle(style) {
  document.documentElement.setAttribute('data-style', style);
  localStorage.setItem('preferredStyle', style);
  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.style === style);
  });
}

function toggleDark() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('preferredTheme', next);
  document.getElementById('darkToggle').textContent = next === 'dark' ? '🌙' : '☀️';
}

// ════════════════════════════════════════════
//  TABS
// ════════════════════════════════════════════
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

// ════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════
function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════

// 主題與風格初始化（在 DOMContentLoaded 前執行，避免 FOUC）
(function() {
  const savedStyle = localStorage.getItem('preferredStyle') || 'industrial';
  const savedTheme = localStorage.getItem('preferredTheme') || 'dark';
  document.documentElement.setAttribute('data-style', savedStyle);
  document.documentElement.setAttribute('data-theme', savedTheme);
})();

async function init() {
  await initAuth();
  // Load data
  loadBlanks();
  load6012();
}

// 頁面載入後初始化按鈕狀態
document.addEventListener('DOMContentLoaded', function() {
  const currentStyle = document.documentElement.getAttribute('data-style') || 'industrial';
  const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.style === currentStyle);
    btn.addEventListener('click', () => applyStyle(btn.dataset.style));
  });
  const darkToggle = document.getElementById('darkToggle');
  if (darkToggle) {
    darkToggle.textContent = currentTheme === 'dark' ? '🌙' : '☀️';
    darkToggle.addEventListener('click', toggleDark);
  }
});

init();
</script>
